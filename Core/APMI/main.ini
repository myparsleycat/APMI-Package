namespace = APMIv1

[IncludeHelpers]
include = Helpers.ini
[IncludeTextPrinter]
include = TextPrinter.ini
[IncludeGUI]
include = GUI.ini
[IncludeKeys]
include = KeyBindings.ini
[Include API]
include = API.ini

[Constants]
global $version = 0.30
global $enable_mods = 1
global $mods_loaded = 0
global $required_version = 0
global $mod_id = 0
run = CommandListCheckXXMI

[ResourceVersionNotification]
type = Buffer
data = "APMI 0.3.0 (F12: GUIDE)"
[ResourceModName]
[ResourceModAuthor]
[ResourceModDesc]
[ResourceModLink]
[ResourceModLogo]

[Present]
run = CommandListRenderGUI

; Shader overrides -------------------------

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if ps === -0.0 && $enable_mods && (DRAW_TYPE == 2 || DRAW_TYPE == 4) && ib
    run = CommandListCheckIB
endif

; XXMI runs matching PS regex command lists in section order. APMICameraFade
; must set its draw parameters before this APMIv1 command list issues a draw.
[ShaderRegexEnableTextureOverridesPS]
shader_model = ps_4_0 ps_4_1 ps_5_0 ps_5_1
if $enable_mods && (DRAW_TYPE == 2 || DRAW_TYPE == 4) && ib
    run = CommandListCheckIB
endif

[ShaderOverrideSkinning1WeightCS]
hash = 3b4f1b1749cd3030
run = CommandListCheckSkinning

[ShaderOverrideSkinning2WeightsCS]
hash = 10749e66a6e6de89
run = CommandListCheckSkinning

[ShaderOverrideSkinning4WeightsCS]
hash = 09d91b2eee7e232f
run = CommandListCheckSkinning

; These vertex shaders read TEXCOORD5 from vb3. Other passes can leave the
; same buffer bound without reading it. XXMI uses 1 for a match without an
; explicit filter index, so these passes use 2.
[ShaderOverridePreviousPositionVS1]
hash = 2571f5fc193d2493
filter_index = 2

[ShaderOverridePreviousPositionVS2]
hash = 41fa76a8d8b511f7
filter_index = 2

[ShaderOverridePreviousPositionVS3]
hash = 76aee80bfa9d1fe0
filter_index = 2

[ShaderOverridePreviousPositionVS4]
hash = 87fb1f2935a64c41
filter_index = 2

[ShaderOverridePreviousPositionVS5]
hash = 9957bb1b9ea9f32c
filter_index = 2

[ShaderOverridePreviousPositionVS6]
hash = a31ae8eadedb8a32
filter_index = 2

[ShaderOverridePreviousPositionVS7]
hash = b41ed46ad43a36ac
filter_index = 2

[ShaderOverridePreviousPositionVS8]
hash = c6deb95121d9b87c
filter_index = 2

[ShaderOverridePreviousPositionVS9]
hash = dc95b97f22ede9be
filter_index = 2

[CustomShaderMeshSkinner]
cs = Shaders/MeshSkinner.hlsl
dispatch = (cs-t0->Size / 40 + 63) / 64, 1, 1

[FilterTest]

[CommandListCheckXXMI]
local $filter_identity = -1
$filter_identity = @FilterTest
if $filter_identity != 0
    $show_xxmi_error = 1
    $show_notification_widget = 1
endif

[CommandListToggleMods]
$enable_mods = !$enable_mods
$option_toggle_time = time
$show_option_toggle_widget = $enum_widget_mods_display

[CommandListRegisterMod]
$mod_id = 1
if $required_version > $version || $required_version < 0
    $mod_id = -1
    ResourceErrorIncompatibleVersionRef = ref ResourceErrorOldVersionAPMI
    ResourceErrorIncompatibleVersionModNameRef = ref ResourceModName
    $show_mod_error = 1
    $show_notification_widget = 1
else
    $mods_loaded = 1
endif
