namespace = APMIv1

[Constants]
global $actor_key = 0
global $actor_x = 0
global $actor_y = 0
global $actor_z = 0
global $actor_facing_x = 0
global $actor_facing_z = 0
global $actor_blend_hi = -1
global $actor_blend_lo = -1
global $actor_format = 0
global $snapshot_actor = 0
global $snapshot_output = 0
global $snapshot_tracks_motion = 0

[CommandListReadSkinActor]
$actor_key = 0
local $output = @vb0
if $output && $PoolBoneMatrices[$output] == FRAME_NUMBER + 1 && vs-cb1->Size >= 128
    $actor_blend_hi = $PoolNativeBlendHi[$output]
    $actor_blend_lo = $PoolNativeBlendLo[$output]
    $actor_format = $PoolNativeSkinFormat[$output]
    if $actor_blend_hi >= 0 && $actor_blend_lo >= 0
        local $affine = 0
        store = $affine, vs-cb1, 15
        if $affine == 1
            ; The game rewrites this buffer within a frame. Read the mapped values directly.
            store = $actor_x, vs-cb1, 12
            store = $actor_y, vs-cb1, 13
            store = $actor_z, vs-cb1, 14
            store = $actor_facing_x, vs-cb1, 8
            store = $actor_facing_z, vs-cb1, 10
            local $checksum = $actor_x * 13 + $actor_y * 41 + $actor_z * 103
            if $checksum >= -100000000 && $checksum <= 100000000
                $actor_key = 1 + $checksum * $checksum
            endif
        endif
    endif
endif

[PoolSkinActorKey0]
pool_size = 128
pool_index_type = fifo

[PoolSkinActorStamp0]
pool_size = 128
pool_index_type = fifo

[PoolSkinActorKey1]
pool_size = 128
pool_index_type = fifo

[PoolSkinActorStamp1]
pool_size = 128
pool_index_type = fifo

[PoolSkinMotionOutput]
pool_size = 128
pool_index_type = fifo

[PoolSkinMotionStamp]
pool_size = 128
pool_index_type = fifo

[CommandListRecordSkinActor]
local $output = @vb0
if vs == 2 && @vb3
    if $PoolSkinMotionStamp[$output] == FRAME_NUMBER + 1
        if $PoolSkinMotionOutput[$output] != @vb3
            $PoolSkinMotionStamp[$output] = -(FRAME_NUMBER + 1)
        endif
    elif $PoolSkinMotionStamp[$output] != -(FRAME_NUMBER + 1)
        $PoolSkinMotionOutput[$output] = @vb3
        $PoolSkinMotionStamp[$output] = FRAME_NUMBER + 1
    endif
endif
if FRAME_NUMBER % 2 == 0
    if $PoolSkinActorStamp0[$output] == FRAME_NUMBER + 1
        if $PoolSkinActorKey0[$output] != $actor_key
            $PoolSkinActorStamp0[$output] = -(FRAME_NUMBER + 1)
        endif
    elif $PoolSkinActorStamp0[$output] != -(FRAME_NUMBER + 1)
        $PoolSkinActorKey0[$output] = $actor_key
        $PoolSkinActorStamp0[$output] = FRAME_NUMBER + 1
    endif
endif
if FRAME_NUMBER % 2 == 1
    if $PoolSkinActorStamp1[$output] == FRAME_NUMBER + 1
        if $PoolSkinActorKey1[$output] != $actor_key
            $PoolSkinActorStamp1[$output] = -(FRAME_NUMBER + 1)
        endif
    elif $PoolSkinActorStamp1[$output] != -(FRAME_NUMBER + 1)
        $PoolSkinActorKey1[$output] = $actor_key
        $PoolSkinActorStamp1[$output] = FRAME_NUMBER + 1
    endif
endif

[CommandListReadPreviousSkinActor]
$snapshot_actor = 0
$snapshot_output = 0
$snapshot_tracks_motion = 0
local $output = 0
if vs == 2
    $output = @vb3
elif $PoolSkinMotionStamp[@vb0] == FRAME_NUMBER + 1
    $output = $PoolSkinMotionOutput[@vb0]
endif
local $has_previous_output = $output != 0
if !$output
    $output = @vb0
endif
if FRAME_NUMBER > 0 && $output && $PoolNativeBlendHi[$output] == $variant_blend_hi && $PoolNativeBlendLo[$output] == $variant_blend_lo && $PoolNativeSkinFormat[$output] == $variant_format
    if (FRAME_NUMBER - 1) % 2 == 0 && $PoolSkinActorStamp0[$output] == FRAME_NUMBER
        $snapshot_actor = $PoolSkinActorKey0[$output]
    endif
    if (FRAME_NUMBER - 1) % 2 == 1 && $PoolSkinActorStamp1[$output] == FRAME_NUMBER
        $snapshot_actor = $PoolSkinActorKey1[$output]
    endif
    if $snapshot_actor > 0
        local $current = @vb0
        run = CommandListReadSkinActor
        local $recorded_actor = 0
        if FRAME_NUMBER % 2 == 0 && $PoolSkinActorStamp0[$current] == FRAME_NUMBER + 1
            $recorded_actor = $PoolSkinActorKey0[$current]
        elif FRAME_NUMBER % 2 == 1 && $PoolSkinActorStamp1[$current] == FRAME_NUMBER + 1
            $recorded_actor = $PoolSkinActorKey1[$current]
        endif
        if !$actor_key || $recorded_actor != $actor_key || (!$has_previous_output && $snapshot_actor != $actor_key)
            $snapshot_actor = 0
        else
            $snapshot_output = $output
            $snapshot_tracks_motion = $has_previous_output
        endif
    endif
endif

[ResourceGatherSource]

[ResourceGatherMap]

[ResourceGatherDestination]

[ResourceGatherOriginalCS0]

[ResourceGatherOriginalCS1]

[ResourceGatherOriginalUAV]

[CommandListGatherSkinBones]
ResourceGatherOriginalCS0 = ref cs-t0
ResourceGatherOriginalCS1 = ref cs-t1
ResourceGatherOriginalUAV = ref cs-u0
cs-t0 = ref ResourceGatherSource
cs-t1 = ref ResourceGatherMap
cs-u0 = ref ResourceGatherDestination
run = CustomShaderGatherSkinBones
cs-u0 = ref ResourceGatherOriginalUAV
cs-t0 = ref ResourceGatherOriginalCS0
cs-t1 = ref ResourceGatherOriginalCS1

[CustomShaderGatherSkinBones]
cs = Shaders/GatherSkinBones.hlsl
dispatch = (cs-t1->Size / 8 + 63) / 64, 1, 1
