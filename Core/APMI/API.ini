namespace = APMIv1

[Constants]
global $component_id = -1
global $gpu_posed = 0
global $variant_mods_loaded = 0
global $variant_mode = 0
global $native_influences = 0
global $identify_native_blend = 0
global $native_blend_hi = -1
global $native_blend_lo = -1
global $variant_output = 0
global $variant_blend_hi = -1
global $variant_blend_lo = -1
global $variant_format = 0
global $variant_is_previous = 0

[PoolBoneMatrices]
pool_size = 128
pool_index_type = fifo
pool_element_type_switch_reset = 0
type = StructuredBuffer
stride = 64
bind_flags = shader_resource

[PoolNativeBlendHi]
pool_size = 128
pool_index_type = fifo
pool_variable_default_value = -1

[PoolNativeBlendLo]
pool_size = 128
pool_index_type = fifo
pool_variable_default_value = -1

[PoolNativeSkinFormat]
pool_size = 128
pool_index_type = fifo

[ResourceOriginalSkinningPosition]
[ResourceOriginalSkinningBlend]
[ResourceOriginalSkinningParams]

[CommandListCheckSkinning]
; A native position buffer identifies the palette used for that pose.
if $enable_mods && $mods_loaded && @cs-u0 && @cs-t2
    local $output = @cs-u0
    PoolBoneMatrices[$output] = copy cs-t2
    if @PoolBoneMatrices[$output]
        $PoolBoneMatrices[$output] = FRAME_NUMBER + 1
    endif
    if $variant_mods_loaded
        $native_blend_hi = -1
        $native_blend_lo = -1
        if @cs-t1
            ResourceOriginalSkinningBlend = ref cs-t1
            $identify_native_blend = 1
            checktextureoverride = cs-t1
            $identify_native_blend = 0
            if @cs-t1 != @ResourceOriginalSkinningBlend
                cs-t1 = ref ResourceOriginalSkinningBlend
            endif
        endif
        $PoolNativeBlendHi[$output] = $native_blend_hi
        $PoolNativeBlendLo[$output] = $native_blend_lo
        $PoolNativeSkinFormat[$output] = (cs-t2->Size / 64) * 8 + $native_influences
    endif
endif

; Keep the compute override entry point used by earlier local exports.
if $enable_mods && cs-t0
    ResourceOriginalSkinningPosition = ref cs-t0
    ResourceOriginalSkinningBlend = ref cs-t1
    ResourceOriginalSkinningParams = ref cs-cb0
    checktextureoverride = cs-t0
    if @cs-t0 != @ResourceOriginalSkinningPosition
        cs-t0 = ref ResourceOriginalSkinningPosition
        cs-t1 = ref ResourceOriginalSkinningBlend
        cs-cb0 = ref ResourceOriginalSkinningParams
    endif
endif

[ResourceOriginalIB]
[ResourceOriginalVB0]
[ResourceOriginalVB1]
[ResourceOriginalVB3]
[ResourceOriginalVB4]

[CommandListCheckIB]
$component_id = -1
$variant_mode = 0
ResourceOriginalIB = ref ib
ResourceOriginalVB0 = ref vb0
ResourceOriginalVB1 = ref vb1
ResourceOriginalVB3 = ref vb3
ResourceOriginalVB4 = ref vb4
checktextureoverride = ib
if @ib != @ResourceOriginalIB
    ib = ref ResourceOriginalIB
endif
if @vb0 != @ResourceOriginalVB0
    vb0 = ref ResourceOriginalVB0
endif
if @vb1 != @ResourceOriginalVB1
    vb1 = ref ResourceOriginalVB1
endif
if @vb3 != @ResourceOriginalVB3
    vb3 = ref ResourceOriginalVB3
endif
if @vb4 != @ResourceOriginalVB4
    vb4 = ref ResourceOriginalVB4
endif

[ResourceInput_Position]
[ResourceInput_Blend]

[ResourcePosition]
bind_flags = vertex_buffer unordered_access
format = DXGI_FORMAT_R32_TYPELESS
stride = 40

[ResourcePreviousPosition]
bind_flags = vertex_buffer unordered_access
format = DXGI_FORMAT_R32_TYPELESS
stride = 40

[ResourceOriginalCS0]
[ResourceOriginalCS1]
[ResourceOriginalCS2]
[ResourceOriginalUAV]

[CommandListCallback_Component_DrawCustom]

[CommandListCallback_SelectSkinVariant]

[ResourceVariantBlend]

[ResourceVariantPalette]

[ResourceCurrentBlend]

[ResourceCurrentPalette]

[ResourcePreviousBlend]

[ResourcePreviousPalette]

[CommandListSelectSkinVariant]
ResourceVariantBlend = null
ResourceVariantPalette = ref PoolBoneMatrices[$variant_output]
$variant_blend_hi = $PoolNativeBlendHi[$variant_output]
$variant_blend_lo = $PoolNativeBlendLo[$variant_output]
$variant_format = $PoolNativeSkinFormat[$variant_output]
if $variant_blend_hi >= 0 && $variant_blend_lo >= 0
    run = CommandListCallback_SelectSkinVariant
endif

[CommandListComponent_DrawInstances]
local $current = @vb0
local $previous = @vb3
local $uses_previous = vs == 2
local $current_frame = $PoolBoneMatrices[$current]
local $previous_frame = $PoolBoneMatrices[$previous]
local $use_previous_palette = $uses_previous && $previous_frame > 0 && $previous_frame >= FRAME_NUMBER - 1
local $can_skin = $component_id >= 0 && $gpu_posed && $current_frame > 0 && $current_frame >= FRAME_NUMBER
if $variant_mode
    $can_skin = $can_skin && $current_frame == FRAME_NUMBER + 1
    $use_previous_palette = $uses_previous && FRAME_NUMBER > 0 && $previous_frame == FRAME_NUMBER
endif
if $can_skin
    ResourceCurrentBlend = ref ResourceInput_Blend
    ResourceCurrentPalette = ref PoolBoneMatrices[$current]
    if $variant_mode
        $variant_is_previous = 0
        $variant_output = $current
        run = CommandListSelectSkinVariant
        ResourceCurrentBlend = ref ResourceVariantBlend
        ResourceCurrentPalette = ref ResourceVariantPalette
    endif
endif
if $can_skin && @ResourceCurrentBlend && @ResourceCurrentPalette
    ResourcePosition = copy_desc ResourceInput_Position
    if @ResourcePosition
        if $use_previous_palette
            ResourcePreviousBlend = ref ResourceInput_Blend
            ResourcePreviousPalette = ref PoolBoneMatrices[$previous]
            if $variant_mode
                $variant_is_previous = 1
                $variant_output = $previous
                run = CommandListSelectSkinVariant
                ResourcePreviousBlend = ref ResourceVariantBlend
                ResourcePreviousPalette = ref ResourceVariantPalette
            endif
            $use_previous_palette = @ResourcePreviousBlend && @ResourcePreviousPalette
            if $use_previous_palette
                ResourcePreviousPosition = copy_desc ResourceInput_Position
                $use_previous_palette = @ResourcePreviousPosition != 0
            endif
        endif

        ResourceOriginalCS0 = ref cs-t0
        ResourceOriginalCS1 = ref cs-t1
        ResourceOriginalCS2 = ref cs-t2
        ResourceOriginalUAV = ref cs-u0
        cs-t0 = ref ResourceInput_Position
        cs-t1 = ref ResourceCurrentBlend
        cs-t2 = ref ResourceCurrentPalette
        cs-u0 = ref ResourcePosition
        run = CustomShaderMeshSkinner
        if $use_previous_palette
            cs-t1 = ref ResourcePreviousBlend
            cs-t2 = ref ResourcePreviousPalette
            cs-u0 = ref ResourcePreviousPosition
            run = CustomShaderMeshSkinner
        endif
        cs-u0 = ref ResourceOriginalUAV
        cs-t0 = ref ResourceOriginalCS0
        cs-t1 = ref ResourceOriginalCS1
        cs-t2 = ref ResourceOriginalCS2

        if $uses_previous
            if $use_previous_palette
                vb3 = ref ResourcePreviousPosition
            else
                ; The original previous buffer uses the original mesh's vertex indices.
                vb3 = ref ResourcePosition
            endif
        endif
        handling = skip
        run = CommandListCallback_Component_DrawCustom
    endif
endif
CommandListCallback_Component_DrawCustom = null
CommandListCallback_SelectSkinVariant = null
$variant_mode = 0

[CommandListPrintText]
run = CommandListRenderText
