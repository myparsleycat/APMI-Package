namespace = APMIv1

[Constants]
global $component_id = -1
global $gpu_posed = 0

[PoolBoneMatrices]
pool_size = 128
pool_index_type = fifo
pool_element_type_switch_reset = 0
type = StructuredBuffer
stride = 64
bind_flags = shader_resource

[ResourceOriginalSkinningPosition]
[ResourceOriginalSkinningBlend]
[ResourceOriginalSkinningParams]

[CommandListCheckSkinning]
; A native position buffer identifies the palette used for that pose.
if $enable_mods && $mods_loaded && @cs-u0 && @cs-t2
    local $output = @cs-u0
    PoolBoneMatrices[$output] = copy cs-t2
    if @PoolBoneMatrices[$output]
        $PoolBoneMatrices[$output] = FRAME_NUMBER + 1
    endif
endif

; Keep the compute override entry point used by earlier local exports.
if $enable_mods && cs-t0
    ResourceOriginalSkinningPosition = ref cs-t0
    ResourceOriginalSkinningBlend = ref cs-t1
    ResourceOriginalSkinningParams = ref cs-cb0
    checktextureoverride = cs-t0
    if @cs-t0 != @ResourceOriginalSkinningPosition
        cs-t0 = ref ResourceOriginalSkinningPosition
        cs-t1 = ref ResourceOriginalSkinningBlend
        cs-cb0 = ref ResourceOriginalSkinningParams
    endif
endif

[ResourceOriginalIB]
[ResourceOriginalVB0]
[ResourceOriginalVB1]
[ResourceOriginalVB3]
[ResourceOriginalVB4]

[CommandListCheckIB]
$component_id = -1
ResourceOriginalIB = ref ib
ResourceOriginalVB0 = ref vb0
ResourceOriginalVB1 = ref vb1
ResourceOriginalVB3 = ref vb3
ResourceOriginalVB4 = ref vb4
checktextureoverride = ib
if @ib != @ResourceOriginalIB
    ib = ref ResourceOriginalIB
endif
if @vb0 != @ResourceOriginalVB0
    vb0 = ref ResourceOriginalVB0
endif
if @vb1 != @ResourceOriginalVB1
    vb1 = ref ResourceOriginalVB1
endif
if @vb3 != @ResourceOriginalVB3
    vb3 = ref ResourceOriginalVB3
endif
if @vb4 != @ResourceOriginalVB4
    vb4 = ref ResourceOriginalVB4
endif

[ResourceInput_Position]
[ResourceInput_Blend]

[ResourcePosition]
bind_flags = vertex_buffer unordered_access
format = DXGI_FORMAT_R32_TYPELESS
stride = 40

[ResourcePreviousPosition]
bind_flags = vertex_buffer unordered_access
format = DXGI_FORMAT_R32_TYPELESS
stride = 40

[ResourceOriginalCS0]
[ResourceOriginalCS1]
[ResourceOriginalCS2]
[ResourceOriginalUAV]

[CommandListCallback_Component_DrawCustom]

[CommandListComponent_DrawInstances]
local $current = @vb0
local $previous = @vb3
local $uses_previous = vs == 2
local $current_frame = $PoolBoneMatrices[$current]
local $previous_frame = $PoolBoneMatrices[$previous]
if $component_id >= 0 && $gpu_posed && $current_frame > 0 && $current_frame >= FRAME_NUMBER
    if !$uses_previous || ($previous_frame > 0 && $previous_frame >= FRAME_NUMBER - 1)
        ResourcePosition = copy_desc ResourceInput_Position
        if $uses_previous
            ResourcePreviousPosition = copy_desc ResourceInput_Position
        endif
        if @ResourcePosition && (!$uses_previous || @ResourcePreviousPosition)
            ResourceOriginalCS0 = ref cs-t0
            ResourceOriginalCS1 = ref cs-t1
            ResourceOriginalCS2 = ref cs-t2
            ResourceOriginalUAV = ref cs-u0
            cs-t0 = ref ResourceInput_Position
            cs-t1 = ref ResourceInput_Blend
            cs-t2 = ref PoolBoneMatrices[$current]
            cs-u0 = ref ResourcePosition
            run = CustomShaderMeshSkinner
            if $uses_previous
                cs-t2 = ref PoolBoneMatrices[$previous]
                cs-u0 = ref ResourcePreviousPosition
                run = CustomShaderMeshSkinner
            endif
            cs-u0 = ref ResourceOriginalUAV
            cs-t0 = ref ResourceOriginalCS0
            cs-t1 = ref ResourceOriginalCS1
            cs-t2 = ref ResourceOriginalCS2
            if $uses_previous
                vb3 = ref ResourcePreviousPosition
            endif
            handling = skip
            run = CommandListCallback_Component_DrawCustom
        endif
    endif
endif
CommandListCallback_Component_DrawCustom = null

[CommandListPrintText]
run = CommandListRenderText
